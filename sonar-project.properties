sonar.organization=rotari-dev
sonar.projectKey=rotari-dev_rotari
sonar.projectName=rotari

sonar.sources=cmd,internal,python/rotari
sonar.tests=cmd,internal,python/tests
sonar.test.inclusions=**/*_test.go,python/tests/**/*.py
sonar.exclusions=docs/**,conformance/**,**/assets/**,**/*.html
# Generated from `rotari schema --json`; repeated flag entries are data, not code.
sonar.cpd.exclusions=python/rotari/generated_cli.py

sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=python-coverage.xml
