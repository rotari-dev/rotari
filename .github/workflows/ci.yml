name: Go CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The macOS leg is being triaged (development/2026-11-14-ci-macos/plan.md):
    # it reports failures without failing the workflow until it passes.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shell completion and read-count test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish strace

      # zsh comes with macOS, and strace does not exist there.
      - name: Install shell completion test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      # Chrome is installed as an app bundle, not on PATH, on macOS runners.
      - name: Point browser tests at Chrome (macOS)
        if: runner.os == 'macOS'
        run: echo "ROTARI_TEST_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Type-check Web UI scripts
        run: npm run typecheck

      - name: Run vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        env:
          ROTARI_REQUIRE_BROWSER_TESTS: "1"
        run: gotestsum --format pkgname-and-test-fails -- -timeout 15m -coverpkg=./cmd/...,./internal/... -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: go build ./cmd/rotari

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shell completion and read-count test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish strace

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run race detector
        run: gotestsum --format pkgname-and-test-fails -- -race -timeout 15m ./...
